<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambient F-dows Dashboard</title>

  <!-- Google Material Symbols is used here for the app buttons icon -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top left, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --accent-color: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.25);
      --like-color: #e11d48;
      --like-hover: #be123c;
      --download-color: #059669;
      --download-hover: #047857;
      --shadow-soft: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.02);
      --shadow-hover: 0 20px 35px -8px rgba(0, 0, 0, 0.12), 0 8px 16px -4px rgba(0, 0, 0, 0.06);
      --modal-bg: rgba(255, 255, 255, 0.92);
      --badge-bg: rgba(37, 99, 235, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-gradient: radial-gradient(circle at top left, #0f172a 0%, #020617 100%);
        --card-bg: rgba(30, 41, 59, 0.6);
        --card-border: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --shadow-soft: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
        --shadow-hover: 0 20px 40px -8px rgba(0, 0, 0, 0.7);
        --modal-bg: rgba(15, 23, 42, 0.92);
        --badge-bg: rgba(37, 99, 235, 0.2);
      }
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; transition: background 0.3s, color 0.3s; }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      display: inline-block;
    }

    /* Glass Header */
    header { position: sticky; top: 0; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); background: rgba(241, 245, 249, 0.75); border-bottom: 1px solid var(--border-color); z-index: 100; padding: 18px 24px; transition: background 0.3s; }
    @media (prefers-color-scheme: dark) {
      header { background: rgba(15, 23, 42, 0.75); }
    }

    .header-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    @media (min-width: 640px) {
      .header-container { flex-direction: row; justify-content: space-between; }
    }

    .brand-title { font-size: 1.6rem; font-weight: 800; tracking: -0.03em; background: linear-gradient(135deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Search Box Input */
    .search-box { position: relative; width: 100%; max-width: 380px; }
    .search-input { width: 100%; padding: 12px 18px 12px 42px; border-radius: 9999px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.25s ease; backdrop-filter: blur(8px); }
    .search-input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 4px var(--accent-glow); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

    /* Layout Container */
    .container { max-width: 1200px; margin: 32px auto; padding: 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 24px; }

    /* App Card Styling */
    .card { background: var(--card-bg); border-radius: 20px; border: 1px solid var(--card-border); padding: 22px; box-shadow: var(--shadow-soft); cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; overflow: hidden; }
    .card:hover { transform: translateY(-6px) scale(1.01); box-shadow: var(--shadow-hover); border-color: rgba(37, 99, 235, 0.4); }
    .card img { width: 84px; height: 84px; border-radius: 20px; object-fit: cover; margin-bottom: 14px; box-shadow: 0 8px 16px rgba(0,0,0,0.12); transition: transform 0.3s ease; }
    .card:hover img { transform: scale(1.05); }
    .card h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.01em; }
    .card p { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .stats { font-size: 0.78rem; font-weight: 700; color: var(--accent-color); background: var(--badge-bg); padding: 6px 14px; border-radius: 9999px; margin-top: auto; display: inline-flex; align-items: center; gap: 4px; }

    /* Skeleton Loading State */
    .skeleton-card { height: 260px; background: linear-gradient(90deg, var(--border-color) 25%, var(--card-bg) 50%, var(--border-color) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 20px; }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(10px); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal { background: var(--modal-bg); border-radius: 24px; border: 1px solid var(--card-border); width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; padding: 28px; position: relative; box-shadow: var(--shadow-hover); animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes modalPop { from { opacity: 0; transform: scale(0.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    
    .close-btn { position: absolute; top: 22px; right: 22px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .close-btn:hover { transform: rotate(90deg); background: var(--border-color); }
    
    .modal-header { display: flex; gap: 18px; align-items: center; margin-bottom: 22px; padding-right: 40px; }
    .modal-header img { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
    .modal-header h2 { font-size: 1.4rem; font-weight: 800; line-height: 1.25; }
    .modal-header p { font-size: 0.88rem; color: var(--text-muted); margin-top: 4px; font-weight: 500; }

    .modal-body { font-size: 0.95rem; line-height: 1.6; color: var(--text-main); margin-bottom: 24px; }
    .screenshots { display: flex; gap: 14px; margin: 18px 0; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .screenshots img { width: 48%; min-width: 180px; max-height: 220px; object-fit: cover; border-radius: 14px; border: 1px solid var(--border-color); cursor: pointer; transition: transform 0.25s, box-shadow 0.25s; scroll-snap-align: start; }
    .screenshots img:hover { transform: scale(1.03); box-shadow: var(--shadow-soft); }

    .app-meta { font-size: 0.82rem; font-weight: 500; color: var(--text-muted); background: rgba(0,0,0,0.03); padding: 12px 16px; border-radius: 12px; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 18px; border: 1px solid var(--border-color); }
    .app-meta span { display: inline-flex; align-items: center; gap: 6px; }
    @media (prefers-color-scheme: dark) { .app-meta { background: rgba(255,255,255,0.03); } }

    .modal-footer { display: flex; gap: 14px; align-items: center; justify-content: space-between; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px; }
    .btn { padding: 12px 24px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.95rem; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); display: inline-flex; align-items: center; gap: 8px; }
    .btn:active { transform: scale(0.96); }
    .btn-download { background: var(--download-color); color: #ffffff; text-decoration: none; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }
    .btn-download:hover { background: var(--download-hover); box-shadow: 0 6px 16px rgba(5, 150, 105, 0.4); }
    .btn-like { background: var(--like-color); color: #ffffff; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }
    .btn-like:hover { background: var(--like-hover); box-shadow: 0 6px 16px rgba(225, 29, 72, 0.4); }

    /* Lightbox Modal */
    .lightbox-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(12px); justify-content: center; align-items: center; z-index: 2000; }
    .lightbox-img { max-width: 92%; max-height: 88vh; border-radius: 16px; object-fit: contain; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .lightbox-close { position: absolute; top: 24px; right: 24px; width: 44px; height: 44px; color: #fff; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .lightbox-close:hover { background: rgba(255,255,255,0.3); }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand-title">F-dows</div>
      <div class="search-box">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search any apps, descriptions or providers..." oninput="handleSearch()">
      </div>
    </div>
  </header>

  <div class="container">
    <div class="grid" id="appGrid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <!-- App Details Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target === this) closeModal()">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div class="modal-header">
        <img id="mLogo" src="" alt="App Logo">
        <div>
          <h2 id="mName"></h2>
          <p id="mProvider"></p>
        </div>
      </div>
      <div class="modal-body">
        <p id="mLongDesc"></p>
        <div class="screenshots">
          <img id="mImg1" src="" alt="Screenshot 1" onclick="openLightbox(this.src)">
          <img id="mImg2" src="" alt="Screenshot 2" onclick="openLightbox(this.src)">
        </div>
        <div class="app-meta">
          <span>
            <span class="material-symbols-outlined">download</span>
            <strong>Downloads:</strong> <span id="mDownloads"></span>
          </span>
          <span>
            <span class="material-symbols-outlined">visibility</span>
            <strong>Views:</strong> <span id="mViews"></span>
          </span>
          <span>
            <span class="material-symbols-outlined">calendar_today</span>
            <strong>Uploaded:</strong> <span id="mUploaded"></span>
          </span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-like" id="likeBtn">
          <span class="material-symbols-outlined">thumb_up</span> Like (<span id="mLikes"></span>)
        </button>
        <a class="btn btn-download" id="downloadBtn" target="_blank">
          <span class="material-symbols-outlined">download</span> Download App
        </a>
      </div>
    </div>
  </div>

  <!-- Fullscreen Screenshot -->
  <div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">
      <span class="material-symbols-outlined">close</span>
    </button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="Fullscreen Screenshot" onclick="event.stopPropagation()">
  </div>

  <script>
    let allApps = [];
    let currentApp = null;

    function fetchApps() {
      google.script.run
        .withSuccessHandler(data => {
          allApps = data || [];
          renderApps(allApps);
        })
        .withFailureHandler((err) => {
          console.error("Error fetching app data:", err);
          document.getElementById('appGrid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Failed to load applications. Please check your connection. Error Code: 1</div>';
        })
        .getAppData();
    }

    function renderApps(apps) {
      const grid = document.getElementById('appGrid');
      
      if (!apps || apps.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No applications found matching your search. Please double check your search. Error Code: 2</div>';
        return;
      }

      apps.sort((a, b) => b.downloader - a.downloader);

      grid.innerHTML = '';
      apps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(app);
        card.innerHTML = `
          <img src="${app.appLogo}" alt="${app.appName}">
          <h3>${app.appName}</h3>
          <p>${app.description}</p>
          <div class="stats">
            <span class="material-symbols-outlined" style="font-size: 16px;">download</span> 
            ${app.downloader.toLocaleString()} Downloads
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        renderApps(allApps);
        return;
      }
      
      const filtered = allApps.filter(app => 
        app.appName.toLowerCase().includes(query) ||
        app.description.toLowerCase().includes(query) ||
        app.provider.toLowerCase().includes(query)
      );
      
      renderApps(filtered);
    }

    function openModal(app) {
      currentApp = app;
      
      document.getElementById('mLogo').src = app.appLogo;
      document.getElementById('mName').innerText = app.appName;
      document.getElementById('mProvider').innerText = "By " + app.provider;
      document.getElementById('mLongDesc').innerText = app.longDescription;
      document.getElementById('mImg1').src = app.screenshot1;
      document.getElementById('mImg2').src = app.screenshot2;
      document.getElementById('mDownloads').innerText = app.downloader.toLocaleString();
      document.getElementById('mUploaded').innerText = app.uploadedDate || "N/A";
      
      app.viewers += 1;
      document.getElementById('mViews').innerText = app.viewers.toLocaleString();
      document.getElementById('mLikes').innerText = app.likes.toLocaleString();
      
      document.getElementById('downloadBtn').href = app.downloadLink;
      
      document.getElementById('modalOverlay').style.display = 'flex';

      google.script.run.updateStat(app.rowIndex, 'view');
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function openLightbox(src) {
      if (!src) return;
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightboxOverlay').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightboxOverlay').style.display = 'none';
    }

    document.getElementById('downloadBtn').onclick = () => {
      if (!currentApp) return;
      currentApp.downloader += 1;
      document.getElementById('mDownloads').innerText = currentApp.downloader.toLocaleString();
      renderApps(allApps);
      google.script.run.updateStat(currentApp.rowIndex, 'download');
    };

    document.getElementById('likeBtn').onclick = () => {
      if (!currentApp) return;
      currentApp.likes += 1;
      document.getElementById('mLikes').innerText = currentApp.likes.toLocaleString();
      google.script.run.updateStat(currentApp.rowIndex, 'like');
    };

    fetchApps();
  </script>
</body>
</html>
