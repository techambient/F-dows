    <style>
        /* Official WinUI 3 Fluent Motion Tokens & Curves */
        :root {
            --winui-duration-faster: 83ms;   /* ControlFasterAnimationDuration */
            --winui-duration-fast: 167ms;    /* ControlFastAnimationDuration */
            --winui-duration-normal: 250ms;  /* ControlNormalAnimationDuration */
            --winui-ease-enter: cubic-bezier(0, 0, 0, 1);           /* Fast Out, Slow In */
            --winui-ease-exit: cubic-bezier(1, 0, 1, 1);            /* Slow Out, Fast In */
            --winui-ease-spring: cubic-bezier(0.16, 1, 0.3, 1);     /* Connected Spring Settle */
            --winui-ease-indicator: cubic-bezier(0.22, 1.25, 0.36, 1); /* NavigationView Pill */
        }

        body {
            font-family: "Segoe UI Variable", "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
            user-select: none;
        }

        .selectable-text {
            user-select: text;
        }

        /* Windows 11 Mica Backdrop */
        .winui-mica-surface {
            background-color: #f3f3f3;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(0, 95, 184, 0.055) 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(0, 120, 212, 0.04) 0%, transparent 50%);
            transition: background-color var(--winui-duration-normal) var(--winui-ease-enter);
        }

        .dark .winui-mica-surface {
            background-color: #202020;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(96, 205, 255, 0.06) 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(0, 95, 184, 0.07) 0%, transparent 50%);
        }

        /* WinUI 3 Control Button Tactile Physics (4px radius, 83ms press compression) */
        .winui-btn {
            border-radius: 4px;
            transition:
                background-color var(--winui-duration-fast) var(--winui-ease-enter),
                border-color var(--winui-duration-fast) var(--winui-ease-enter),
                color var(--winui-duration-fast) var(--winui-ease-enter),
                box-shadow var(--winui-duration-fast) var(--winui-ease-enter),
                transform var(--winui-duration-faster) var(--winui-ease-enter);
            will-change: transform;
        }
        .winui-btn:active:not(:disabled) {
            transform: scale(0.972);
        }

        /* WinUI 3 Standard Secondary Button Elevation Border */
        .winui-btn-standard {
            background-color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom-color: rgba(0, 0, 0, 0.16);
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.02);
        }
        .winui-btn-standard:hover:not(:disabled) {
            background-color: rgba(249, 249, 249, 0.95);
            border-color: rgba(0, 0, 0, 0.11);
            border-bottom-color: rgba(0, 0, 0, 0.18);
        }
        .winui-btn-standard:active:not(:disabled) {
            background-color: rgba(243, 243, 243, 0.9);
            border-bottom-color: rgba(0, 0, 0, 0.09);
            box-shadow: none;
        }
        .dark .winui-btn-standard {
            background-color: rgba(255, 255, 255, 0.055);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-top-color: rgba(255, 255, 255, 0.11);
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.12);
        }
        .dark .winui-btn-standard:hover:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.085);
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 255, 255, 0.14);
        }
        .dark .winui-btn-standard:active:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.035);
            border-top-color: rgba(255, 255, 255, 0.06);
            box-shadow: none;
        }

        /* WinUI 3 Accent Primary Button Elevation Border */
        .winui-btn-accent {
            background-color: #005fb8;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom-color: rgba(0, 0, 0, 0.28);
            color: #ffffff;
        }
        .winui-btn-accent:hover:not(:disabled) {
            background-color: #196ebf;
        }
        .winui-btn-accent:active:not(:disabled) {
            background-color: #004c94;
            border-bottom-color: rgba(0, 0, 0, 0.1);
        }
        .dark .winui-btn-accent {
            background-color: #60cdff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom-color: rgba(0, 0, 0, 0.25);
            color: #002845;
        }
        .dark .winui-btn-accent:hover:not(:disabled) {
            background-color: #52b8e8;
        }
        .dark .winui-btn-accent:active:not(:disabled) {
            background-color: #44a3d1;
        }

        /* WinUI 3 AutoSuggestBox & Input Bottom Accent Line */
        .winui-input {
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 1.5px solid rgba(0, 0, 0, 0.42);
            transition:
                background-color var(--winui-duration-fast) var(--winui-ease-enter),
                border-color var(--winui-duration-fast) var(--winui-ease-enter),
                box-shadow var(--winui-duration-fast) var(--winui-ease-enter);
        }
        .winui-input:hover:not(:focus-within):not(:focus) {
            background-color: rgba(252, 252, 252, 1);
            border-color: rgba(0, 0, 0, 0.12);
            border-bottom-color: rgba(0, 0, 0, 0.52);
        }
        .winui-input:focus-within,
        .winui-input:focus {
            border-color: rgba(0, 0, 0, 0.08);
            border-bottom: 2px solid #005fb8;
            box-shadow: 0 2px 8px rgba(0, 95, 184, 0.08);
            outline: none;
        }
        .dark .winui-input {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.45);
        }
        .dark .winui-input:hover:not(:focus-within):not(:focus) {
            background-color: #363636;
            border-color: rgba(255, 255, 255, 0.12);
            border-bottom-color: rgba(255, 255, 255, 0.55);
        }
        .dark .winui-input:focus-within,
        .dark .winui-input:focus {
            border-color: rgba(255, 255, 255, 0.08);
            border-bottom: 2px solid #60cdff;
            box-shadow: 0 2px 10px rgba(96, 205, 255, 0.1);
            outline: none;
        }

        /* WinUI 3 Layer Card with Fluent Reveal Pointer Sheen (8px Radius) */
        .winui-card {
            --rx: 50%;
            --ry: 50%;
            border-radius: 8px;
            background-color: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.058);
            border-bottom-color: rgba(0, 0, 0, 0.11);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
            position: relative;
            transition:
                background-color var(--winui-duration-fast) var(--winui-ease-enter),
                border-color var(--winui-duration-fast) var(--winui-ease-enter),
                box-shadow var(--winui-duration-normal) var(--winui-ease-enter),
                transform var(--winui-duration-fast) var(--winui-ease-enter);
        }
        .winui-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(
                240px circle at var(--rx) var(--ry),
                rgba(0, 95, 184, 0.045),
                transparent 75%
            );
            transition: opacity var(--winui-duration-normal) var(--winui-ease-enter);
        }
        .winui-card:hover::before {
            opacity: 1;
        }
        .winui-card:hover {
            background-color: #fcfcfc;
            border-color: rgba(0, 0, 0, 0.11);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.065), 0 1px 3px rgba(0, 0, 0, 0.035);
            transform: translateY(-1px);
        }
        .winui-card:active {
            transform: translateY(0px) scale(0.994);
            transition-duration: var(--winui-duration-faster);
        }

        .dark .winui-card {
            background-color: #2d2d2d;
            border: 1px solid rgba(255, 255, 255, 0.068);
            border-top-color: rgba(255, 255, 255, 0.105);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        }
        .dark .winui-card::before {
            background: radial-gradient(
                240px circle at var(--rx) var(--ry),
                rgba(255, 255, 255, 0.055),
                transparent 75%
            );
        }
        .dark .winui-card:hover {
            background-color: #323232;
            border-color: rgba(255, 255, 255, 0.125);
            border-top-color: rgba(255, 255, 255, 0.16);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.18);
        }

        /* WinUI 3 Keyframe Motion Library */
        @keyframes winuiDrillIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes winuiCardCascade {
            0% {
                opacity: 0;
                transform: translateY(8px) scale(0.985);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Authentic WinUI 3 ContentDialog Scale-Down Entrance (1.045 -> 1.0) */
        @keyframes winuiDialogEnter {
            0% {
                opacity: 0;
                transform: scale(1.045);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes winuiDialogExit {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.975);
            }
        }

        @keyframes winuiBackdropEnter {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes winuiBackdropExit {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes winuiCheckStroke {
            0% {
                stroke-dashoffset: 18;
                transform: scale(0.75);
            }
            100% {
                stroke-dashoffset: 0;
                transform: scale(1);
            }
        }

        @keyframes winuiHeartPop {
            0% { transform: scale(1); }
            45% { transform: scale(1.28); }
            100% { transform: scale(1); }
        }

        @keyframes winuiProgressSweep {
            0% {
                transform: translateX(-100%) scaleX(0.35);
            }
            50% {
                transform: translateX(35%) scaleX(0.65);
            }
            100% {
                transform: translateX(220%) scaleX(0.35);
            }
        }

        .animate-winui-page {
            animation: winuiDrillIn var(--winui-duration-normal) var(--winui-ease-enter) both;
        }

        .animate-winui-card {
            animation: winuiCardCascade var(--winui-duration-normal) var(--winui-ease-enter) both;
        }

        .animate-winui-dialog-in {
            animation: winuiDialogEnter var(--winui-duration-normal) var(--winui-ease-enter) both;
        }

        .animate-winui-dialog-out {
            animation: winuiDialogExit var(--winui-duration-fast) var(--winui-ease-exit) both;
        }

        .animate-winui-backdrop-in {
            animation: winuiBackdropEnter var(--winui-duration-fast) var(--winui-ease-enter) both;
        }

        .animate-winui-backdrop-out {
            animation: winuiBackdropExit var(--winui-duration-fast) var(--winui-ease-exit) both;
        }

        .animate-winui-check {
            stroke-dasharray: 18;
            animation: winuiCheckStroke var(--winui-duration-fast) var(--winui-ease-enter) both;
        }

        .animate-winui-heart {
            animation: winuiHeartPop 220ms var(--winui-ease-spring);
        }

        .animate-winui-progress {
            animation: winuiProgressSweep 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* WinUI 3 Thin Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.36);
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.36);
        }

        /* Material Symbols Alignment */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            line-height: 1;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }
    </style>
</head>

        const CATEGORIES_LIST = [
            { name: "Developer", icon: "code", desc: "IDEs, compilers, SDKs, and version control tools" },

            { name: "Communication", icon: "chat", desc: "Messaging, VoIP, and team collaboration apps" },
            { name: "Productivity", icon: "description", desc: "Notes, office suites, and task organization" },
            { name: "Gaming", icon: "sports_esports", desc: "Launchers, overlays, and gaming utilities" }
        ];

        // Icon Domain Resolver
        function resolveAppIcon(publisher, homepageUrl) {
            if (homepageUrl) {
                try {
                    const domain = new URL(homepageUrl).hostname.replace('www.', '');
                    return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
                } catch (e) {}
            }
            const cleanPub = (publisher || 'app').toLowerCase().replace(/[^a-z0-9]/g, '');
            return `https://www.google.com/s2/favicons?domain=${cleanPub}.com&sz=128`;
        }

        // API Package Parser
        function parseWingetRunPackage(pkg) {
            const latestVer = pkg.Latest || pkg.Versions?.[0] || {};
            const publisher = latestVer.Publisher || pkg.Publisher || (pkg.Id ? pkg.Id.split('.')[0] : "Community Publisher");
            const homepage = latestVer.Homepage || pkg.Homepage || "";
            const realIcon = resolveAppIcon(publisher, homepage);

            return {
                id: pkg.Id,
                name: latestVer.Name || pkg.Name || pkg.Id.split('.').pop(),
                publisher: publisher,
                version: latestVer.Version || pkg.LatestVersion || "Latest",
                category: (latestVer.Tags && latestVer.Tags.length > 0) ? latestVer.Tags[0] : "General",
                description: latestVer.Description || latestVer.ShortDescription || `Package ${pkg.Id} retrieved via Sync.`,
                tags: latestVer.Tags || ["winget", "package"],
                icon: realIcon,
                downloadUrl: homepage || `https://winget.run/pkg/${pkg.Id}`,
                arch: "x64, x86, arm64",
                installerType: "Winget Manifest",
                license: latestVer.License || "Community License",
                popular: (pkg.Popularity && pkg.Popularity > 10) || pkg.Featured || false,
                searchScore: pkg.SearchScore || 0
            };
        }

        // Relevance Ranking Algorithm
        function calculateRelevanceScore(app, query) {
            if (!query) return 0;
            const q = query.toLowerCase().trim();
            const name = (app.name || '').toLowerCase();
            const id = (app.id || '').toLowerCase();
            const pub = (app.publisher || '').toLowerCase();
            const desc = (app.description || '').toLowerCase();
            const cat = (app.category || '').toLowerCase();
            const tags = Array.isArray(app.tags) ? app.tags.map(t => String(t).toLowerCase()) : [];

            let score = 0;
            if (app.searchScore) score += app.searchScore * 10;

            if (id === q) score += 1000;
            if (name === q) score += 900;
            if (name.startsWith(q)) score += 500;
            if (id.startsWith(q)) score += 450;

            const nameWords = name.split(/\s+/);
            if (nameWords.some(w => w === q)) score += 300;

            const idSegments = id.split(/[\.\-_]/);
            if (idSegments.some(s => s === q)) score += 250;

            if (name.includes(q)) score += 100;
            if (id.includes(q)) score += 80;
            if (pub.includes(q)) score += 50;
            if (cat.includes(q)) score += 40;
            if (tags.some(t => t.includes(q))) score += 30;
            if (desc.includes(q)) score += 10;

            if (app.popular) score += 5;
            return score;
        }

        function sortPackagesByRelevance(packages, query) {
            if (!query || !query.trim()) return packages;
            return packages
                .map(pkg => ({ pkg, score: calculateRelevanceScore(pkg, query) }))
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score)
                .map(item => item.pkg);
        }

        function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text);
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
            }
        }

            e.currentTarget.style.setProperty('--rx', `${e.clientX - rect.left}px`);
            e.currentTarget.style.setProperty('--ry', `${e.clientY - rect.top}px`);
        }

        function App() {
            // Core State
            const [appData, setAppData] = useState([...SEED_PACKAGES]);
            const [popularApps, setPopularApps] = useState(() => SEED_PACKAGES.filter(a => a.popular));
            const [batchApps, setBatchApps] = useState([]);
            const [wishlistApps, setWishlistApps] = useState(() => {
                try {
                    const stored = localStorage.getItem(LOCALSTORAGE_WISHLIST_KEY);
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    return [];
                }
            });

            // Navigation & Filter State
            const [currentTab, setCurrentTab] = useState('explore');
            const [currentViewMode, setCurrentViewMode] = useState('grid');
            const [currentCategory, setCurrentCategory] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

            // Async & Status State
            const [isLoading, setIsLoading] = useState(false);
            const [loadingText, setLoadingText] = useState('Resyncing...');
            const [isRefreshingAll, setIsRefreshingAll] = useState(false);
            const [apiStatus, setApiStatus] = useState({
                label: 'Sync Status: Live',
                dotClass: 'bg-emerald-500'
            });

            // ContentDialog Modal & Exit Animation State
            const [selectedAppId, setSelectedAppId] = useState(null);
            const [isClosingModal, setIsClosingModal] = useState(false);
            const [modalTab, setModalTab] = useState('details');
            const [toast, setToast] = useState({ visible: false, message: '' });

            // Theme State (Explicit Light / Dark triggers)
            const [theme, setTheme] = useState(() => {
                const saved = localStorage.getItem(LOCALSTORAGE_THEME_KEY);
                if (saved === 'dark' || saved === 'light') return saved;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            });

            const searchDebounceRef = useRef(null);
            const toastTimerRef = useRef(null);
            const modalCloseTimerRef = useRef(null);
            const searchInputRef = useRef(null);
            const navContainerRef = useRef(null);
            const navButtonRefs = useRef({});
            const [indicatorStyle, setIndicatorStyle] = useState({ top: 14, height: 16, ready: false });

            const appDataRef = useRef(appData);
            appDataRef.current = appData;

            const navItems = useMemo(() => [
                { id: 'explore', label: 'Explore Repo', icon: 'explore' },
                { id: 'popular', label: 'Popular Apps', icon: 'local_fire_department' },
                { id: 'categories', label: 'Categories', icon: 'grid_view' },
                { id: 'batch', label: 'Download Script', icon: 'checklist', badge: batchApps.length, badgeTone: 'accent' },
                { id: 'wishlist', label: 'Wishlist', icon: 'favorite', badge: wishlistApps.length, badgeTone: 'rose' }
            ], [batchApps.length, wishlistApps.length]);

            // Measure active NavigationViewItem to slide the WinUI 3 Selection Indicator Pill smoothly
            const updateNavIndicator = useCallback(() => {
                const activeEl = navButtonRefs.current[currentTab];
                const containerEl = navContainerRef.current;
                if (activeEl && containerEl) {
                    const top = activeEl.offsetTop + (activeEl.offsetHeight - 16) / 2;
                    setIndicatorStyle({ top, height: 16, ready: true });
                }
            }, [currentTab]);

            useEffect(() => {
                updateNavIndicator();
                window.addEventListener('resize', updateNavIndicator);
                return () => window.removeEventListener('resize', updateNavIndicator);
            }, [updateNavIndicator, sidebarCollapsed]);

            // Global Keyboard Shortcuts (Ctrl+K / '/' to search, Esc to close modal)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        searchInputRef.current?.focus();
                    } else if (
                        e.key === '/' &&
                        document.activeElement?.tagName !== 'INPUT' &&
                        document.activeElement?.tagName !== 'TEXTAREA'
                    ) {
                        e.preventDefault();
                        searchInputRef.current?.focus();
                    } else if (e.key === 'Escape' && selectedAppId) {
                        closeModal();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedAppId]);

            // Sync Theme Class & Persistence
            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem(LOCALSTORAGE_THEME_KEY, theme);
            }, [theme]);

            // Sync Wishlist Persistence
            useEffect(() => {
                try {
                    localStorage.setItem(LOCALSTORAGE_WISHLIST_KEY, JSON.stringify(wishlistApps));
                } catch (e) {
                    console.warn("Could not save wishlist to localStorage", e);
                }
            }, [wishlistApps]);

            const showToast = useCallback((message) => {
                setToast({ visible: true, message });
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => {
                    setToast(prev => ({ ...prev, visible: false }));
                }, 2500);
            }, []);

            // Fetch All Winget Packages
            const fetchAllWingetPackages = useCallback(async () => {
                setIsRefreshingAll(true);
                setIsLoading(true);
                setLoadingText("Resyncing live catalog & popular packages...");

                try {
                    const response = await fetch(`${WINGET_RUN_API_BASE}/packages?take=100`);
                    if (response.ok) {
                        const result = await response.json();
                        const packages = result.Packages || result || [];

                        if (packages.length > 0) {
                            const fetched = packages.map(pkg => parseWingetRunPackage(pkg));
                            const mergedMap = new Map();
                            [...SEED_PACKAGES, ...fetched].forEach(p => mergedMap.set(p.id, p));
                            const nextAppData = Array.from(mergedMap.values());
                            setAppData(nextAppData);

                            let nextPopular = nextAppData
                                .filter(a => a.popular || (a.searchScore && a.searchScore > 0))
                                .sort((a, b) => (b.searchScore || 0) - (a.searchScore || 0));

                            if (nextPopular.length < 4) {
                                nextPopular = nextAppData.slice(0, 8);
                            }
                            setPopularApps(nextPopular);

                            setApiStatus({
                                label: 'Sync Status: Resynced',
                                dotClass: 'bg-emerald-500'
                            });
                            showToast(`Catalog & Popular Apps resynced (${nextAppData.length} packages)!`);
                        }
                    } else {
                        throw new Error(`API status ${response.status}`);
                    }
                } catch (err) {
                    console.warn("Winget REST API notice (using seed catalog fallback):", err);
                    setPopularApps(appDataRef.current.filter(a => a.popular));
                    setApiStatus({
                        label: 'Catalog Active (Local Fallback)',
                        dotClass: 'bg-amber-500'
                    });
                } finally {
                    setIsRefreshingAll(false);
                    setIsLoading(false);
                }
            }, [showToast]);

            // Initial Boot Sync
            useEffect(() => {
                fetchAllWingetPackages();
                return () => {
                    if (searchDebounceRef.current) clearTimeout(searchDebounceRef.current);
                    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                    if (modalCloseTimerRef.current) clearTimeout(modalCloseTimerRef.current);
                };
            }, [fetchAllWingetPackages]);

            // Live API Search Handler (1s Inactivity Trigger)
            const performLiveSearch = useCallback(async (overrideQuery) => {
                const query = (overrideQuery !== undefined ? overrideQuery : searchQuery).trim();
                if (!query) return;

                setIsLoading(true);
                setLoadingText(`Auto-resyncing for "${query}"...`);

                let latestPool = appDataRef.current;

                try {
                    const searchRes = await fetch(`${WINGET_RUN_API_BASE}/packages?query=${encodeURIComponent(query)}&take=50`);
                    if (searchRes.ok) {
                        const result = await searchRes.json();
                        const packages = result.Packages || result || [];

                        if (packages.length > 0) {
                            const searchFetched = packages.map(pkg => parseWingetRunPackage(pkg));
                            const mergedMap = new Map();
                            searchFetched.forEach(p => mergedMap.set(p.id, p));
                            latestPool.forEach(p => {
                                if (!mergedMap.has(p.id)) mergedMap.set(p.id, p);
                            });
                            latestPool = Array.from(mergedMap.values());
                            setAppData(latestPool);
                            setApiStatus({
                                label: `Synced: "${query}"`,
                                dotClass: 'bg-emerald-500'
                            });
                        }
                    }
                } catch (err) {
                    console.warn("Online search API unreachable, filtering catalog locally.", err);
                    setApiStatus({
                        label: 'Catalog Active (Local Fallback)',
                        dotClass: 'bg-amber-500'
                    });
                } finally {
                    setIsLoading(false);
                    const matched = sortPackagesByRelevance(latestPool, query);
                    if (matched.length > 0) {
                        showToast(`Auto-synced ${matched.length} results by relevance`);
                    }
                }
            }, [searchQuery, showToast]);

            const handleSearchChange = (e) => {
                const value = e.target.value;
                setSearchQuery(value);

                if (searchDebounceRef.current) {
                    clearTimeout(searchDebounceRef.current);
                }

                const trimmed = value.trim();
                if (trimmed.length > 0) {
                    if (currentTab !== 'explore') {
                        setCurrentTab('explore');
                    }
                    searchDebounceRef.current = setTimeout(() => {
                        performLiveSearch(trimmed);
                    }, 1000);
                }
            };

            const handleSearchKeyDown = (e) => {
                if (e.key === 'Enter') {
                    if (searchDebounceRef.current) clearTimeout(searchDebounceRef.current);
                    if (currentTab !== 'explore') setCurrentTab('explore');
                    performLiveSearch(searchQuery);
                } else if (e.key === 'Escape' && searchQuery) {
                    clearSearch();
                }
            };

            const clearSearch = () => {
                setSearchQuery('');
                setCurrentCategory('all');
                if (searchDebounceRef.current) clearTimeout(searchDebounceRef.current);
            };

            // Category Filter
            const filterCategory = async (cat) => {
                setCurrentCategory(cat);

                if (cat !== 'all') {
                    setIsLoading(true);
                    setLoadingText(`Resyncing "${cat}" category...`);
                    try {
                        const catRes = await fetch(`${WINGET_RUN_API_BASE}/packages?query=${encodeURIComponent(cat)}&take=50`);
                        if (catRes.ok) {
                            const result = await catRes.json();
                            const packages = result.Packages || result || [];
                            if (packages.length > 0) {
                                const catFetched = packages.map(pkg => parseWingetRunPackage(pkg));
                                const mergedMap = new Map();
                                catFetched.forEach(p => {
                                    p.category = cat;
                                    mergedMap.set(p.id, p);
                                });
                                appDataRef.current.forEach(p => {
                                    if (!mergedMap.has(p.id)) mergedMap.set(p.id, p);
                                });
                                setAppData(Array.from(mergedMap.values()));
                                setApiStatus({
                                    label: `Resynced: "${cat}" Category`,
                                    dotClass: 'bg-emerald-500'
                                });
                            }
                        }
                    } catch (e) {

                                            onClick={closeModal}
                                            title="Close (Esc)"
                                            className="winui-btn w-8 h-8 flex items-center justify-center hover:bg-black/[0.05] dark:hover:bg-white/[0.08] text-winui-textSecondaryLight dark:text-winui-textSecondaryDark"
                                        >
                                            <span className="material-symbols-outlined text-[19px]">close</span>
                                        </button>
                                    </div>
                                </div>

                                {/* WinUI 3 Pivot Tabs with Sliding Accent Underline */}
                                <div className="relative px-5 border-b border-black/[0.06] dark:border-white/[0.07] flex gap-5 text-[13px]">
                                    <button
                                        onClick={() => setModalTab('details')}
                                        className={`relative py-2.5 font-semibold transition-colors duration-[167ms] ${
                                            modalTab === 'details'
                                                ? 'text-winui-accentLight dark:text-winui-accentDark'
                                                : 'text-winui-textSecondaryLight dark:text-winui-textSecondaryDark hover:text-winui-textPrimaryLight dark:hover:text-winui-textPrimaryDark'
                                        }`}
                                    >
                                        Specifications
                                        <span
                                            className={`absolute bottom-0 left-0 right-0 h-[2.5px] rounded-full bg-winui-accentLight dark:bg-winui-accentDark transition-all duration-[200ms] ease-[cubic-bezier(0,0,0,1)] origin-center ${
                                                modalTab === 'details' ? 'opacity-100 scale-x-100' : 'opacity-0 scale-x-0'
                                            }`}
                                        />
                                    </button>
                                    <button
                                        onClick={() => setModalTab('yaml')}
                                        className={`relative py-2.5 font-semibold transition-colors duration-[167ms] ${
                                            modalTab === 'yaml'
                                                ? 'text-winui-accentLight dark:text-winui-accentDark'
                                                : 'text-winui-textSecondaryLight dark:text-winui-textSecondaryDark hover:text-winui-textPrimaryLight dark:hover:text-winui-textPrimaryDark'
                                        }`}
                                    >
                                        Raw Manifest
                                        <span
                                            className={`absolute bottom-0 left-0 right-0 h-[2.5px] rounded-full bg-winui-accentLight dark:bg-winui-accentDark transition-all duration-[200ms] ease-[cubic-bezier(0,0,0,1)] origin-center ${
                                                modalTab === 'yaml' ? 'opacity-100 scale-x-100' : 'opacity-0 scale-x-0'
                                            }`}
                                        />
                                    </button>
                                </div>

                                {/* ContentDialog Body */}
                                <div className="p-5 overflow-y-auto space-y-4 flex-1 text-[13px]">
                                    {modalTab === 'details' ? (
                                        <div key="modal-details" className="animate-winui-page space-y-4">
                                            <div>
                                                <h4 className="text-[11px] font-semibold uppercase tracking-wider text-winui-textSecondaryLight dark:text-winui-textSecondaryDark mb-1">
                                                    Description
                                                </h4>
                                                <p className="leading-relaxed selectable-text">
                                                    {selectedApp.description}
                                                </p>
                                            </div>

                                            {/* Metadata Layer Cards (8px radius) */}
                                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                                <div className="p-3 rounded-[8px] bg-winui-subtleLight dark:bg-winui-subtleDark border border-black/[0.06] dark:border-white/[0.07]">
                                                    <span className="text-[11px] font-medium text-winui-textSecondaryLight dark:text-winui-textSecondaryDark block">
                                                        License
                                                    </span>
                                                    <span className="text-[13px] font-semibold mt-0.5 block">
                                                        {selectedApp.license}
                                                    </span>
                                                </div>
                                                <div className="p-3 rounded-[8px] bg-winui-subtleLight dark:bg-winui-subtleDark border border-black/[0.06] dark:border-white/[0.07]">
                                                    <span className="text-[11px] font-medium text-winui-textSecondaryLight dark:text-winui-textSecondaryDark block">
                                                        Installer Type
                                                    </span>
                                                    <span className="text-[13px] font-semibold mt-0.5 block">
                                                        {selectedApp.installerType}
                                                    </span>
                                                </div>
                                                <div className="p-3 rounded-[8px] bg-winui-subtleLight dark:bg-winui-subtleDark border border-black/[0.06] dark:border-white/[0.07]">
                                                    <span className="text-[11px] font-medium text-winui-textSecondaryLight dark:text-winui-textSecondaryDark block">
                                                        Architecture
                                                    </span>
                                                    <span className="text-[13px] font-semibold mt-0.5 block">
                                                        {selectedApp.arch}
                                                    </span>
                                                </div>
                                            </div>

                                            {/* CLI Command Input (4px radius) */}
                                            <div className="space-y-1.5">
                                                <span className="text-[11px] font-semibold uppercase tracking-wider text-winui-textSecondaryLight dark:text-winui-textSecondaryDark block">
                                                    Winget CLI Direct Command
                                                </span>
                                                <div className="relative flex items-center">
                                                    <input
                                                        readOnly
                                                        type="text"
                                                        value={`winget install --id ${selectedApp.id} -e`}
                                                        className="winui-input w-full h-9 pl-3 pr-20 rounded-[4px] font-mono text-[12px] bg-[#18181b] text-emerald-400 selectable-text"
                                                    />
                                                    <button
                                                        onClick={() => {
                                                            copyTextToClipboard(`winget install --id ${selectedApp.id} -e`);
                                                            showToast('CLI install command copied!');
                                                        }}
                                                        className="winui-btn winui-btn-accent absolute right-1.5 h-6 px-2.5 text-[11.5px] font-semibold"
                                                    >
                                                        Copy
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div key="modal-yaml" className="animate-winui-page space-y-2">
                                            <div className="flex items-center justify-between">
                                                <span className="text-[11.5px] font-semibold text-winui-textSecondaryLight dark:text-winui-textSecondaryDark uppercase">
                                                    Raw Package Metadata
                                                </span>
                                                <span className="text-[11px] text-winui-accentLight dark:text-winui-accentDark font-mono">
                                                    microsoft/winget-pkgs
                                                </span>
                                            </div>
                                            <pre className="p-3.5 rounded-[4px] font-mono text-[11.5px] bg-[#18181b] text-slate-200 border border-white/[0.08] overflow-x-auto max-h-60 leading-relaxed selectable-text">
{`# Winget Package Manifest
PackageIdentifier: ${selectedApp.id}
PackageVersion: ${selectedApp.version}
Publisher: ${selectedApp.publisher}
PackageName: ${selectedApp.name}
License: ${selectedApp.license}
ShortDescription: ${selectedApp.description}`}
                                            </pre>
                                        </div>
                                    )}
                                </div>

                                {/* ContentDialog Footer Command Strip */}
                                <div className="px-5 py-3.5 bg-winui-layerLight dark:bg-[#222222] border-t border-black/[0.06] dark:border-white/[0.07] flex items-center justify-between gap-2.5">
                                    <a
                                        href={selectedApp.downloadUrl}
                                        target="_blank"
                                        rel="noreferrer"
                                        className="winui-btn winui-btn-accent h-8 px-4 text-[12px] font-semibold flex items-center gap-1.5"
                                    >
                                        <span className="material-symbols-outlined text-[16px]">open_in_new</span>
                                        <span>Official Release / Site</span>
                                    </a>
                                    <button
                                        onClick={() => toggleBatch(selectedApp)}
                                        className="winui-btn winui-btn-standard h-8 px-4 text-[12px] font-semibold flex items-center gap-1.5"
                                    >
                                        <span className="material-symbols-outlined text-[16px]">
                                            {batchApps.some(b => b.id === selectedApp.id) ? 'check' : 'add'}
                                        </span>
                                        <span>
                                            {batchApps.some(b => b.id === selectedApp.id)
                                                ? 'Remove from Download'
                                                : 'Add to Download Queue'}
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* WinUI 3 Flyout / TeachingTip Toast Notification (8px radius, Fast Out Slow In) */}
                    <div
                        className={`fixed bottom-16 md:bottom-5 right-5 z-50 pointer-events-none transition-all duration-[220ms] ease-[cubic-bezier(0,0,0,1)] ${
                            toast.visible ? 'translate-y-0 scale-100 opacity-100' : 'translate-y-4 scale-95 opacity-0'
                        }`}
                    >
                        <div className="px-4 py-2.5 rounded-[8px] shadow-winui-flyout border border-black/[0.09] dark:border-white/[0.11] flex items-center gap-2.5 bg-white/95 dark:bg-[#2f2f2f]/95 backdrop-blur-md text-winui-textPrimaryLight dark:text-winui-textPrimaryDark text-[12.5px] font-semibold">
                            <span className="material-symbols-outlined text-emerald-600 dark:text-emerald-400 text-[18px] filled">
                                check_circle
                            </span>
                            <span>{toast.message}</span>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
